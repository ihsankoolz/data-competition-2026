# Multilingual dictionary for the duplicate check (D-005 layer 3).
#
# Order of use (see ds/dedup/normalize.py):
#   1. thai_script: replaced in the ORIGINAL string (Thai has no spaces between words),
#      before rough romanisation with anyascii.
#   2. abbreviations: a short form typed by a user -> the long local form (token level).
#   3. translations: local-language phrase -> one English canonical word (token level).
#   4. canonical: spelling variants -> one spelling.
#   5. stopwords: dropped.
#   6. aliases: well-known acronyms and short names -> the full name they stand for.
# All non-Thai entries are plain ASCII lower case (diacritics are stripped before lookup).
# Generated acronyms (initials of every master name) are added at index time, not listed here.

