[project]
name = "lives-mdm"
version = "0.1.0"
description = "Lives Group MDM prototype: messy in, clean out"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "anyascii>=0.3.3",
    "cleanco>=2.3",
    "cryptography>=50.0.2",
    "faker>=40.43.0",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "jellyfish>=1.3.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.6",
    "statsforecast>=2.0.1",
    "tenacity>=9.2.1",
    "utilsforecast>=0.2.17",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ds", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
